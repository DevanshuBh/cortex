name: release

# On a version tag: publish multi-arch images to GHCR (the Oracle Always Free VM is Arm).
# The demo UI is published by pages.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Backend (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/cortex-backend:${{ github.sha }},ghcr.io/${{ steps.owner.outputs.name }}/cortex-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sandbox image and runner
        run: |
          for c in image runner; do
            docker buildx build --platform linux/amd64,linux/arm64 --push \
              -t ghcr.io/${{ steps.owner.outputs.name }}/cortex-sandbox-$c:${{ github.sha }} \
              -t ghcr.io/${{ steps.owner.outputs.name }}/cortex-sandbox-$c:latest sandbox/$c
          done
