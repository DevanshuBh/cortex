name: nightly-eval

# Retrieval evaluation on the labelled set every night. Needs no language model, so it runs on a free runner:
# start the data stores, ingest the corpus with the pinned embedding model, run the ablation, and fail on a
# statistically significant drop against the last committed report (exit code 2).
on:
  schedule: [{ cron: "30 21 * * *" }] # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image and start the data stores
        run: |
          docker compose build migrate
          docker compose up -d postgres redis neo4j seaweedfs
          docker compose run --rm migrate
      - name: Ingest the corpus
        run: |
          docker compose run --rm -v "$PWD/corpus:/corpus:ro" migrate sh -c \
            "python -m cortex.cli tenant k8s-docs && python -m cortex.cli ingest-dir k8s-docs /corpus/kubernetes"
      - name: Retrieval evaluation (fails on a significant regression)
        run: |
          docker compose run --rm -v "$PWD/eval:/eval" -w /eval -e PYTHONPATH=/eval migrate \
            python -m cortex_eval retrieval --tenant k8s-docs --configs dense,sparse,fused,reranked --name retrieval
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: eval/reports }
