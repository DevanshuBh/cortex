# CORTEX services. Images come from GHCR (multi-arch: the Oracle A1 VM is arm64).
apiVersion: batch/v1
kind: Job
metadata: { name: migrate, namespace: cortex }
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: cortex-backend
          command: ["sh", "-c", "python -m cortex.cli migrate && python -m cortex.cli init"]
          envFrom: [{ configMapRef: { name: cortex-config } }, { secretRef: { name: cortex-secrets } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: cortex }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: cortex-backend
          envFrom: [{ configMapRef: { name: cortex-config } }, { secretRef: { name: cortex-secrets } }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /readyz, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 1Gi } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 256Mi } }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: cortex }
spec: { selector: { app: api }, ports: [{ port: 8000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker-ask, namespace: cortex }
spec:
  replicas: 1 # KEDA scales this on queue depth (keda.yaml)
  selector: { matchLabels: { app: worker-ask } }
  template:
    metadata: { labels: { app: worker-ask } }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 360 # let a running answer finish (hard limit 330 s)
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: cortex-backend
          command: ["sh", "-c", "mkdir -p /tmp/prometheus && exec celery -A cortex.worker.app worker -Q ask -c 2 --prefetch-multiplier=1 -n ask@$(HOSTNAME)"]
          env: [{ name: PROMETHEUS_MULTIPROC_DIR, value: /tmp/prometheus }]
          envFrom: [{ configMapRef: { name: cortex-config } }, { secretRef: { name: cortex-secrets } }]
          ports: [{ containerPort: 9100, name: metrics }]
          resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { memory: 2560Mi } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 512Mi } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker-ingest, namespace: cortex }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker-ingest } }
  template:
    metadata: { labels: { app: worker-ingest } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: cortex-backend
          command: ["sh", "-c", "mkdir -p /tmp/prometheus && exec celery -A cortex.worker.app worker -Q ingest -c 1 --prefetch-multiplier=1 -n ingest@$(HOSTNAME)"]
          env: [{ name: PROMETHEUS_MULTIPROC_DIR, value: /tmp/prometheus }]
          envFrom: [{ configMapRef: { name: cortex-config } }, { secretRef: { name: cortex-secrets } }]
          resources: { requests: { cpu: 250m, memory: 768Mi }, limits: { memory: 2Gi } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 512Mi } }]
---
# sandbox-runner: may only create, watch and delete pods in cortex-sandbox. No Docker socket on k3s.
apiVersion: v1
kind: ServiceAccount
metadata: { name: sandbox-runner, namespace: cortex }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: run-sandbox-pods, namespace: cortex-sandbox }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/attach, pods/log]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sandbox-runner, namespace: cortex-sandbox }
subjects: [{ kind: ServiceAccount, name: sandbox-runner, namespace: cortex }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: run-sandbox-pods }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sandbox-runner, namespace: cortex }
spec:
  replicas: 1
  selector: { matchLabels: { app: sandbox-runner } }
  template:
    metadata: { labels: { app: sandbox-runner } }
    spec:
      serviceAccountName: sandbox-runner
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: runner
          image: cortex-sandbox-runner
          env:
            - { name: SANDBOX_BACKEND, value: kubernetes }
            - { name: SANDBOX_IMAGE, value: ghcr.io/devanshubh/cortex-sandbox-image:latest }
            - { name: SANDBOX_RUNNER_TOKEN, valueFrom: { secretKeyRef: { name: cortex-secrets, key: SANDBOX_RUNNER_TOKEN } } }
          ports: [{ containerPort: 8090 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8090 }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: sandbox-runner, namespace: cortex }
spec: { selector: { app: sandbox-runner }, ports: [{ port: 8090 }] }
