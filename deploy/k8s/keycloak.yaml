apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak, namespace: cortex }
spec:
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2
          args: ["start", "--import-realm", "--http-enabled=true", "--proxy-headers=xforwarded", "--hostname=https://auth.CHANGE-ME.duckdns.org", "--hostname-backchannel-dynamic=true", "--health-enabled=true"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: cortex-secrets, key: KC_BOOTSTRAP_ADMIN_PASSWORD } } }
            - { name: JAVA_OPTS_KC_HEAP, value: "-Xms256m -Xmx512m" }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health/ready, port: 9000 }, periodSeconds: 10, failureThreshold: 30 }
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }
          volumeMounts: [{ name: realm, mountPath: /opt/keycloak/data/import }]
      volumes: [{ name: realm, configMap: { name: keycloak-realm } }]
---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: cortex }
spec: { selector: { app: keycloak }, ports: [{ port: 8080 }] }
