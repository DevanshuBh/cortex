# Template only. Copy to secrets.yaml, fill in, then encrypt before committing:
#   sops --encrypt --age <your-age-public-key> --encrypted-regex '^(data|stringData)$' secrets.yaml > secrets.enc.yaml
# and apply with:  sops -d secrets.enc.yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata: { name: cortex-secrets, namespace: cortex }
type: Opaque
stringData:
  CORTEX_DATABASE_URL: postgresql+psycopg://cortex_app:CHANGE-ME@postgres:5432/cortex
  CORTEX_MIGRATION_DATABASE_URL: postgresql+psycopg://cortex_owner:CHANGE-ME@postgres:5432/cortex
  POSTGRES_PASSWORD: CHANGE-ME
  CORTEX_NEO4J_PASSWORD: CHANGE-ME
  NEO4J_AUTH: neo4j/CHANGE-ME
  CORTEX_S3_ACCESS_KEY: CHANGE-ME
  CORTEX_S3_SECRET_KEY: CHANGE-ME
  CORTEX_SANDBOX_RUNNER_TOKEN: CHANGE-ME
  SANDBOX_RUNNER_TOKEN: CHANGE-ME
  KC_BOOTSTRAP_ADMIN_PASSWORD: CHANGE-ME
