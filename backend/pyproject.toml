[project]
name = "cortex"
version = "0.1.0"
description = "Multi-tenant research assistant: hybrid retrieval, knowledge graph and budgeted agents with cited answers"
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
  "fastapi>=0.162.7",
  "uvicorn[standard]>=0.54.0",
  "python-multipart>=0.0.33",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.3",
  "celery[redis]>=5.7.0",
  "redis>=8.1.0",
  "sqlalchemy>=2.1.8",
  "psycopg[binary,pool]>=3.3.9",
  "alembic>=1.20.1",
  "pgvector>=0.5.1",
  "neo4j>=6.4.1",
  "langgraph>=1.2.22",
  "boto3>=1.44.3",
  "httpx>=0.28.1",
  "pypdf>=7.1.0",
  "markdown-it-py>=4.3.0",
  "beautifulsoup4>=4.15.0",
  "sentence-transformers>=6.3.0",
  "torch>=2.15.0",
  "numpy>=2.5.4",
  "pyjwt[crypto]>=2.15.1",
  "prometheus-client>=0.26.0",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "structlog>=26.1.0",
]

[project.optional-dependencies]
eval = ["scipy>=1.18.1", "mlflow-skinny>=3.18.0"]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-timeout>=2.4.0",
  "ruff>=0.17.5",
  "mypy>=2.4.1",
  "testcontainers[postgres,redis,neo4j]>=4.15.0",
  "boto3-stubs[s3]>=1.44.0",
]

[project.scripts]
cortex = "cortex.cli:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["cortex"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "sentence_transformers.*", "pgvector.*", "markdown_it.*", "testcontainers.*", "pypdf.*", "botocore.*", "mlflow.*", "scipy.*", "transformers.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
  "integration: needs Docker (Testcontainers)",
  "sandbox: needs Docker and the sandbox image",
  "models: needs the embedding/reranker models downloaded",
]

[[tool.mypy.overrides]]
# Celery's task decorator is untyped.
module = ["cortex.worker.tasks", "cortex.worker.app"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
